<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520">
<style>
  .shake { animation: shake 0.9s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .pulse { animation: pulse 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes shake { 25% { transform: rotate(-4deg); } 75% { transform: rotate(4deg); } }
  @keyframes pulse { 50% { transform: scale(1.12); } }
  @media (prefers-reduced-motion: reduce) { .shake, .pulse { animation: none; } }
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
</style>
<defs>
  <pattern id="burst" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><rect width="20" height="40" fill="#f0447a" opacity="0.15"/></pattern>
</defs>
<rect width="1200" height="520" fill="#111"/>
<rect width="1200" height="520" fill="url(#burst)"/>

<!-- goat card -->
<rect x="70" y="70" width="440" height="400" fill="#000"/>
<rect x="56" y="56" width="440" height="400" fill="#d9d4c7" stroke="#000" stroke-width="5"/>
<text x="276" y="196" text-anchor="middle" font-size="110">🐐</text>
<text x="276" y="250" text-anchor="middle" font-size="34" font-weight="900" fill="#111">THE GOAT</text>
<text x="276" y="280" text-anchor="middle" class="mono" font-size="16" fill="#444">Herdr app, plain</text>
<text x="86" y="330" class="mono" font-size="19" font-weight="700" fill="#111">tab chaos ........ 💯</text>
<text x="86" y="366" class="mono" font-size="19" font-weight="700" fill="#111">who's stuck? ..... 🤷</text>
<text x="86" y="402" class="mono" font-size="19" font-weight="700" fill="#111">plan left ........ ???</text>
<text x="86" y="438" class="mono" font-size="19" font-weight="700" fill="#111">vibe ............. 😐</text>

<!-- whale card -->
<rect x="718" y="70" width="440" height="400" fill="#000"/>
<rect x="704" y="56" width="440" height="400" fill="#9fd36a" stroke="#000" stroke-width="5"/>
<g class="pulse"><text x="924" y="196" text-anchor="middle" font-size="110">🐋</text></g>
<text x="924" y="250" text-anchor="middle" font-size="34" font-weight="900" fill="#111">THE WHALE</text>
<text x="924" y="280" text-anchor="middle" class="mono" font-size="16" fill="#1d3a10">Herdr app + orcha-app</text>
<text x="734" y="330" class="mono" font-size="19" font-weight="700" fill="#111">tab chaos ........ 0</text>
<text x="734" y="366" class="mono" font-size="19" font-weight="700" fill="#111">who's stuck? ..... 🚨 that one</text>
<text x="734" y="402" class="mono" font-size="19" font-weight="700" fill="#111">plan left ........ 81% ⛽</text>
<text x="734" y="438" class="mono" font-size="19" font-weight="700" fill="#111">vibe ............. 🔥</text>

<!-- VS -->
<g class="shake"><circle cx="600" cy="256" r="78" fill="#f2c53d" stroke="#000" stroke-width="6"/>
<text x="600" y="282" text-anchor="middle" font-size="68" font-weight="900" fill="#111" font-style="italic">VS</text></g>
<rect x="430" y="470" width="340" height="38" fill="#f0447a" stroke="#000" stroke-width="4" transform="rotate(-2 600 489)"/>
<text x="600" y="497" text-anchor="middle" font-size="22" font-weight="900" fill="#fff" transform="rotate(-2 600 489)">same engine. way more brain.</text>
</svg>
