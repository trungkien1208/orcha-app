<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560">
<style>
  .bob { animation: bob 1.8s ease-in-out infinite; }
  .wob { animation: wob 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .spark { animation: spark 1.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .spark2 { animation: spark 1.2s ease-in-out 0.6s infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes bob { 50% { transform: translateY(-9px); } }
  @keyframes wob { 50% { transform: rotate(-4deg) scale(1.05); } }
  @keyframes spark { 0%, 100% { opacity: 0.2; transform: scale(0.7); } 50% { opacity: 1; transform: scale(1.15); } }
  @media (prefers-reduced-motion: reduce) { .bob, .wob, .spark, .spark2 { animation: none; } }
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
</style>
<defs>
  <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="2" fill="#111" opacity="0.13"/></pattern>
  <pattern id="stripes" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="14" height="28" fill="#111" opacity="0.9"/></pattern>
</defs>
<rect width="1200" height="560" fill="#9fd36a"/>
<rect width="1200" height="560" fill="url(#dots)"/>
<rect x="0" y="522" width="1200" height="38" fill="#f2c53d"/>
<rect x="0" y="522" width="1200" height="38" fill="url(#stripes)" opacity="0.18"/>

<!-- goat card -->
<rect x="50" y="110" width="250" height="300" fill="#111"/>
<rect x="40" y="100" width="250" height="300" fill="#fff4d6" stroke="#111" stroke-width="5"/>
<text x="165" y="208" text-anchor="middle" font-size="84">🐐</text>
<text x="165" y="254" text-anchor="middle" font-size="30" font-weight="900" fill="#111">THE GOAT</text>
<text x="165" y="280" text-anchor="middle" class="mono" font-size="15" fill="#555">Herdr app</text>
<text x="66" y="330" class="mono" font-size="18" font-weight="800" fill="#111">a window ... ✅</text>
<text x="66" y="364" class="mono" font-size="18" font-weight="800" fill="#111">a brain .... ❌</text>

<!-- plus -->
<g class="wob"><circle cx="340" cy="250" r="34" fill="#7f9bff" stroke="#111" stroke-width="5"/>
<text x="340" y="268" text-anchor="middle" font-size="48" font-weight="900" fill="#111">+</text></g>

<!-- whale card -->
<rect x="400" y="110" width="250" height="300" fill="#111"/>
<rect x="390" y="100" width="250" height="300" fill="#fff4d6" stroke="#111" stroke-width="5"/>
<text x="515" y="208" text-anchor="middle" font-size="84">🐋</text>
<text x="515" y="254" text-anchor="middle" font-size="30" font-weight="900" fill="#111">THE WHALE</text>
<text x="515" y="280" text-anchor="middle" class="mono" font-size="15" fill="#555">orcha, in a terminal</text>
<text x="416" y="330" class="mono" font-size="18" font-weight="800" fill="#111">a window ... ❌</text>
<text x="416" y="364" class="mono" font-size="18" font-weight="800" fill="#111">a brain .... ✅</text>

<!-- equals -->
<g class="wob"><circle cx="690" cy="250" r="34" fill="#f0447a" stroke="#111" stroke-width="5"/>
<text x="690" y="267" text-anchor="middle" font-size="46" font-weight="900" fill="#fff">=</text></g>

<!-- fusion card -->
<rect x="758" y="46" width="414" height="440" fill="#111"/>
<rect x="744" y="32" width="414" height="440" fill="#f2c53d" stroke="#111" stroke-width="6"/>
<g class="bob">
  <text x="951" y="214" text-anchor="middle" font-size="150">🐋</text>
  <text x="944" y="124" text-anchor="middle" font-size="76">🐐</text>
  <text x="948" y="74" text-anchor="middle" font-size="46">👑</text>
</g>
<text x="776" y="96" font-size="34" class="spark">✨</text>
<text x="1104" y="150" font-size="30" class="spark2">⚡</text>
<text x="1092" y="80" font-size="26" class="spark">✨</text>
<text x="784" y="210" font-size="28" class="spark2">⚡</text>
<text x="951" y="282" text-anchor="middle" font-size="40" font-weight="900" fill="#111" letter-spacing="-1">GOATWHALE</text>
<rect x="790" y="296" width="322" height="38" fill="#111" transform="rotate(-2 951 315)"/>
<text x="951" y="322" text-anchor="middle" class="mono" font-size="17" font-weight="900" fill="#9fd36a" transform="rotate(-2 951 315)">FINAL FINAL FINAL FORM</text>
<text x="951" y="362" text-anchor="middle" class="mono" font-size="16" font-weight="800" fill="#111">= orcha-app</text>
<text x="780" y="404" class="mono" font-size="18" font-weight="800" fill="#111">window ✅ brain ✅ chaos 0</text>
<text x="780" y="440" class="mono" font-size="18" font-weight="800" fill="#111">vibe ............ 🔥🔥🔥</text>

<!-- stickers -->
<g class="wob"><rect x="60" y="34" width="250" height="44" rx="22" fill="#fff" stroke="#111" stroke-width="4"/>
<text x="185" y="63" text-anchor="middle" font-size="19" font-weight="900" fill="#111">⚗️ the experiment</text></g>
<rect x="250" y="438" width="420" height="44" fill="#f0447a" transform="rotate(-2 460 460)"/>
<text x="460" y="468" text-anchor="middle" font-size="23" font-weight="900" fill="#fff" transform="rotate(-2 460 460)">one window. one brain. zero chaos.</text>
<text x="1170" y="510" text-anchor="end" class="mono" font-size="14" font-weight="800" fill="#111">no goats or whales were harmed 🍵</text>
</svg>
