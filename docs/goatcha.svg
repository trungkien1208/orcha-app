<style>
  .bob { animation: bob 2s ease-in-out infinite; }
  .wob { animation: wob 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .spark { animation: spark 1.3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .spark2 { animation: spark 1.3s ease-in-out .65s infinite; transform-box: fill-box; transform-origin: center; }
  .glow { animation: glow 2s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-8px); } }
  @keyframes wob { 50% { transform: rotate(-6deg) scale(1.05); } }
  @keyframes spark { 0%,100% { opacity: .25; transform: scale(.7); } 50% { opacity: 1; transform: scale(1.15); } }
  @keyframes glow { 50% { opacity: .55; } }
  @media (prefers-reduced-motion: reduce) { .bob,.wob,.spark,.spark2,.glow { animation: none; } }
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .row { font-size: 18px; font-weight: 750; fill: #111; }
</style>
